spring.application.name=xyz-bff

server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore/bff-keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bff-local

# Lee la misma BD H2 generada por la app batch, pero sin relanzar jobs.
spring.datasource.url=jdbc:h2:file:../xyz/data/bankxyz;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.com.banco.xyz=INFO
logging.level.org.springframework.security=INFO
