spring.application.name=xyz

# Base de datos H2 (relacional embebida, modo PostgreSQL)
spring.datasource.url=jdbc:h2:file:./data/bankxyz;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Pool para workers particionados + metadatos de Spring Batch
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.minimum-idle=3

# Consola H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

server.port=8080

# Semana 4 BFF: batch carga datos y el servidor queda escuchando APIs
bank.batch.run-on-startup=true
bank.batch.exit-after-jobs=false
bank.batch.compare-params=false

# Escalado (semana 3)
bank.batch.chunk-size=10
bank.batch.threads=3
bank.batch.grid-size=3
bank.batch.queue-capacity=25
bank.batch.skip-limit=2000
bank.batch.retry-limit=3
bank.batch.job-retry-limit=1
bank.batch.backoff-initial-ms=80
bank.batch.backoff-multiplier=2.0
bank.batch.backoff-max-ms=800

logging.level.com.banco.xyz=INFO
logging.level.com.banco.xyz.batch.processor=WARN
logging.level.com.banco.xyz.batch.listener=WARN
logging.level.com.banco.xyz.batch.policy.FileVerificationSkipper=WARN
logging.level.org.springframework.batch=WARN
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{40} - %msg%n
