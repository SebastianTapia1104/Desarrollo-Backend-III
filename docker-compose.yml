services:
  h2:
    build: ./h2-server
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9092'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  batch:
    build: ./xyz
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:tcp://h2:9092/bankxyz;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    depends_on:
      h2:
        condition: service_healthy
    restart: "no"

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8888'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 40s
    restart: on-failure

  eureka-server:
    build: ./eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8761'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 40s
    restart: on-failure

  auth-server:
    build: ./auth-server
    environment:
      BANK_OAUTH_ISSUER: http://auth-server:9000
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 40s
    restart: on-failure

  ms-transacciones:
    build: ./ms-transacciones
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
    ports:
      - "8081:8081"
      - "61616:61616"
    depends_on:
      batch:
        condition: service_completed_successfully
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
    restart: on-failure

  ms-intereses:
    build: ./ms-intereses
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
    ports:
      - "8082:8082"
    depends_on:
      batch:
        condition: service_completed_successfully
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
    restart: on-failure

  ms-cuentas:
    build: ./ms-cuentas
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
    ports:
      - "8083:8083"
    depends_on:
      ms-transacciones:
        condition: service_started
      batch:
        condition: service_completed_successfully
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
    restart: on-failure

  api-gateway:
    build: ./api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      - ms-transacciones
      - ms-intereses
      - ms-cuentas
    restart: on-failure
